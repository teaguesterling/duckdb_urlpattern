#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # github.event_name is part of the key on purpose. Without it a push to a
  # branch and a workflow_dispatch on that same branch collide: same ref, same
  # sha, both with empty head_ref/base_ref. cancel-in-progress then kills the
  # push run every time the canary is dispatched by hand, and a cancelled run
  # reads as a FAILED one on the checks dashboard -- which is exactly how this
  # PR came to show five red checks with nothing actually broken (push run
  # 33836472803 cancelled four seconds in by workflow_dispatch run 33836476774,
  # same sha 057358a).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Forward-compat leg: intentionally builds against duckdb `main`. Expected to be
  # red on upstream API drift (e.g. ScalarFunction::init_local_state removed,
  # BaseExpression::alias protected, bind_scalar_function_t change). This is NOT a
  # merge gate; it is an early-warning signal for the next stable line.
  duckdb-next-build:
    name: Canary — build against DuckDB main (advisory)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: urlpattern
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'
      # Windows MSVC (windows_amd64) re-enabled and green.
      # Exclude windows_amd64_mingw: rtools42 mingw-g++ libstdc++ can't compile
      #   ada-url 3.3.0 (non-constexpr string->string_view in url-inl.h:47)
      # Exclude WASM: emscripten clang 20.0 still crashes (SIGSEGV) on ada-url C++20 templates
      exclude_archs: 'windows_amd64_mingw;wasm_threads;wasm_eh;wasm_mvp'

  # Stable leg: the merge gate. The submodule pointer tracks the v1.5-variegata
  # branch tip, but we BUILD against the v1.5.4 release tag: branch-tip builds
  # emit non-loadable `-dev` extensions, whereas the tagged release produces
  # loadable artifacts and matches the prebuilt v1.5.4 CLI used for tests.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: urlpattern
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'
      # Windows MSVC (windows_amd64) re-enabled and green.
      # Exclude windows_amd64_mingw: rtools42 mingw-g++ libstdc++ can't compile
      #   ada-url 3.3.0 (non-constexpr string->string_view in url-inl.h:47)
      # Exclude WASM: emscripten clang 20.0 still crashes (SIGSEGV) on ada-url C++20 templates
      exclude_archs: 'windows_amd64_mingw;wasm_threads;wasm_eh;wasm_mvp'
