#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # github.event_name is part of the key on purpose. Without it a push to a
  # branch and a workflow_dispatch on that same branch collide: same ref, same
  # sha, both with empty head_ref/base_ref. cancel-in-progress then kills the
  # push run every time the canary is dispatched by hand, and a cancelled run
  # reads as a FAILED one on the checks dashboard -- which is exactly how this
  # PR came to show five red checks with nothing actually broken (push run
  # 33836472803 cancelled four seconds in by workflow_dispatch run 33836476774,
  # same sha 057358a).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # THE NEXT-LINE BUILD: the v2.0 RELEASE branch, not `main`. One canary line for
  # the whole fleet, and the branch v2.0.0 is cut from. Pinning the release branch
  # is what makes a red run actionable -- `main` moves underneath the job, so a
  # failure there cannot be told apart from upstream churn.
  #
  # It runs on pull requests as well as pushes to main, because what it checks is a
  # property of the CHANGE, not of upstream drift. duckdb/community-extensions
  # builds every release against the v2.0 line with no per-extension opt-out, so a
  # break here is a red check on every release -- which is why this is a gate and
  # not advisory.
  #
  # vcpkg_commit is the baseline the REGISTRY uses for this line, not the one the
  # v1.5 legs use: community-extensions/.github/workflows/build.yml resolves
  # COMMUNITY_EXTENSION_VCPKG_COMMIT to 84bab45d... only when duckdb_version is
  # v1.5.6, and to cd61e1e2... otherwise. Matching it here means ada-url resolves
  # the same way locally as it will when the descriptor is built.
  #
  # `if` rather than `continue-on-error`: a job calling a REUSABLE WORKFLOW accepts
  # only name/needs/if/permissions/uses/with/secrets/strategy/concurrency, and
  # adding continue-on-error makes the whole workflow fail to PARSE (zero jobs
  # scheduled, run marked failed).
  duckdb-next-build:
    name: Next-line build — DuckDB v2.0
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: urlpattern
      vcpkg_commit: 'cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3'
      # Same exclusions as the other legs, and for the same upstream reasons:
      # windows_amd64_mingw -- rtools42 mingw-g++ libstdc++ cannot compile ada-url
      #   3.3.0 (non-constexpr string->string_view in url-inl.h:47)
      # WASM -- emscripten clang 20.0 SIGSEGVs on ada-url C++20 templates
      exclude_archs: 'windows_amd64_mingw;wasm_threads;wasm_eh;wasm_mvp'

      # Make a skipped test run FAIL on this leg. `T` is the test pattern ci-tools
      # hands run_tests.py (`T ?=` in duckdb_extension.Makefile, so an env var wins)
      # and test_env_variables reaches `make test_release` via ci_phase.py.
      # `--require urlpattern` turns "could not load" into `require urlpattern: FAILED`
      # instead of a silent skip. Verified on ci-tools main against b15358c371d:
      # present -> exit 0 "16 passed, 2 skipped"; hidden -> exit 2 "0 passed, 18 failed".
      # Needs a ci_tools_version that HAS `T` (main / v2.0-cyanoptera); on
      # v1.5-variegata the variable is silently ignored -- hence `make test-require`.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require urlpattern\" \"test/*\""}}'
  # Advisory canary against duckdb `main`, which is AHEAD of the v2.0 release
  # branch. Kept as its own job rather than merged into the one above: this one may
  # legitimately be red on churn that will never reach v2.0.0, so it stays gated to
  # dispatch and pushes to main and never enters a PR's check rollup.
  duckdb-main-canary:
    name: Canary build — DuckDB main (advisory)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: urlpattern
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'
      exclude_archs: 'windows_amd64_mingw;wasm_threads;wasm_eh;wasm_mvp'

  # Stable leg: the merge gate. The submodule pointer tracks the v1.5-variegata
  # branch tip, but we BUILD against the v1.5.4 release tag: branch-tip builds
  # emit non-loadable `-dev` extensions, whereas the tagged release produces
  # loadable artifacts and matches the prebuilt v1.5.4 CLI used for tests.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: urlpattern
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'
      # Windows MSVC (windows_amd64) re-enabled and green.
      # Exclude windows_amd64_mingw: rtools42 mingw-g++ libstdc++ can't compile
      #   ada-url 3.3.0 (non-constexpr string->string_view in url-inl.h:47)
      # Exclude WASM: emscripten clang 20.0 still crashes (SIGSEGV) on ada-url C++20 templates
      exclude_archs: 'windows_amd64_mingw;wasm_threads;wasm_eh;wasm_mvp'
